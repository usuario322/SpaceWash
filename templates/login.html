{% extends "base.html" %}
{% block content %}

<style>
    body {
        background: linear-gradient(135deg, #2B2E74);
        height: 100vh;
    }

    .login-card {
        background: white;
        border-radius: 15px;
        padding: 25px;
        border-top: 8px solid #FED353;
        box-shadow: 0 8px 20px rgba(0,0,0,0.2);
    }

    .login-title {
        font-weight: bold;
        color: #2B2E74;
    }

    .btn-login {
        background-color: #2B2E74;
        border: none;
        color: white;
    }

    .btn-login:hover {
        background-color: #1ABC9C;
        color: white;
    }

    .logo-container img {
        width: 120px;
        display: block;
        margin: 0 auto 15px auto;
    }
</style>


<div class="container d-flex justify-content-center align-items-center" style="height: 100vh;">
    <div class="col-md-4">

        <div class="login-card">

            <!-- ⬇️ AQUI VA TU LOGO ⬇️ -->
            <div class="logo-container">
                <img src="/static/img/logo.png" alt="Logo SpaceWash">
            </div>

            <h3 class="text-center login-title">SpaceWash</h3>
            <p class="text-center text-muted">Inicio de sesión</p>

            <form method="POST" action="/login">

                <div class="mb-3">
                    <label class="form-label">Usuario</label>
                    <input type="text" name="usuario" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Contraseña</label>
                    <input type="password" name="password" class="form-control" required>
                </div>

                <button class="btn btn-login w-100">Ingresar</button>

            </form>

        </div>
    </div>
</div>

{% endblock %}
